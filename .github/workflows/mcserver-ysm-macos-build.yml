name: MCServer YSM macOS and Windows development
on:
  workflow_dispatch:
  push:
    branches: [ysm-macos-development]
    paths: ['development/ysm-macos/**', '.github/workflows/mcserver-ysm-macos-build.yml']
permissions:
  contents: read
concurrency:
  group: ysm-cross-platform-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows-native:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: actions/cache@v4
        id: windows-cache
        with:
          path: development/ysm-macos/native/conan/cache
          key: ysm-windows2025-clang22-e9ac162-v1-${{ github.run_id }}
          restore-keys: ysm-windows2025-clang22-e9ac162-v1-
      - name: Build and test Windows x64 native library
        shell: pwsh
        run: '& ./development/ysm-macos/build-windows.ps1'
      - uses: actions/cache/save@v4
        if: always() && steps.windows-cache.outputs.cache-hit != 'true'
        with:
          path: development/ysm-macos/native/conan/cache
          key: ysm-windows2025-clang22-e9ac162-v1-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: YSM-Windows-native-${{ github.run_id }}
          path: development/ysm-macos/dist/ysm.dll
          if-no-files-found: error
          retention-days: 7

  macos-native-and-neoforge:
    needs: windows-native
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Cache the private static C++ runtime
        id: runtime-cache
        uses: actions/cache@v4
        with:
          path: development/ysm-macos/static-runtime
          key: ysm-macos15-arm64-libcxx22-abi2-v1
      - name: Cache source-built native dependencies
        id: conan-cache
        uses: actions/cache@v4
        with:
          path: development/ysm-macos/native/conan/cache
          key: ysm-macos15-arm64-conan-abi2-llvm22-ar-v2-${{ github.run_id }}
          restore-keys: ysm-macos15-arm64-conan-abi2-llvm22-ar-v2-
      - name: Build and test Apple Silicon native library
        run: bash development/ysm-macos/build-native.sh
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: YSM-Windows-native-${{ github.run_id }}
          path: development/ysm-macos/windows-artifact
      - name: Build and test the NeoForge 1.21.1 universal mod
        env:
          YSM_WINDOWS_NATIVE_PATH: ${{ github.workspace }}/development/ysm-macos/windows-artifact/ysm.dll
        run: bash development/ysm-macos/build-neoforge.sh
      - name: Retain the complete static runtime after downstream failures
        if: always() && steps.runtime-cache.outputs.cache-hit != 'true' && hashFiles('development/ysm-macos/static-runtime/lib/libc++_static.a') != ''
        uses: actions/cache/save@v4
        with:
          path: development/ysm-macos/static-runtime
          key: ysm-macos15-arm64-libcxx22-abi2-v1
      - name: Retain built dependency packages after downstream failures
        if: always() && steps.conan-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: development/ysm-macos/native/conan/cache
          key: ysm-macos15-arm64-conan-abi2-llvm22-ar-v2-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: YSM-macOS-development-${{ github.run_number }}
          path: |
            development/ysm-macos/evidence/
            development/ysm-macos/dist/
          if-no-files-found: warn
          retention-days: 7
