name: MCServer YSM macOS development
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Native platform to build
        type: choice
        options: [macos, windows]
        default: macos
  push:
    branches: [ysm-macos-development]
    paths: ['development/ysm-macos/**', '.github/workflows/mcserver-ysm-macos-build.yml']
permissions:
  contents: read
concurrency:
  group: ysm-native-${{ github.ref }}-${{ inputs.platform || 'macos' }}
  cancel-in-progress: false
jobs:
  native-and-java:
    if: inputs.platform != 'windows'
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Cache the private static C++ runtime
        id: runtime-cache
        uses: actions/cache@v4
        with:
          path: development/ysm-macos/static-runtime
          key: ysm-macos15-arm64-libcxx22-abi2-v1
      - name: Cache source-built native dependencies
        id: conan-cache
        uses: actions/cache@v4
        with:
          path: development/ysm-macos/native/conan/cache
          key: ysm-macos15-arm64-conan-abi2-llvm22-ar-v2-${{ github.run_id }}
          restore-keys: |
            ysm-macos15-arm64-conan-abi2-llvm22-ar-v2-
      - name: Build and test the Apple Silicon native library
        run: bash development/ysm-macos/build-native.sh
      - name: Build and test the Java integration
        run: bash development/ysm-macos/build-java.sh
      - name: Retain the complete static runtime after downstream failures
        if: always() && steps.runtime-cache.outputs.cache-hit != 'true' && hashFiles('development/ysm-macos/static-runtime/lib/libc++_static.a') != ''
        uses: actions/cache/save@v4
        with:
          path: development/ysm-macos/static-runtime
          key: ysm-macos15-arm64-libcxx22-abi2-v1
      - name: Retain built dependency packages after downstream failures
        if: always() && steps.conan-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: development/ysm-macos/native/conan/cache
          key: ysm-macos15-arm64-conan-abi2-llvm22-ar-v2-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: YSM-macOS-development-${{ github.run_number }}
          path: |
            development/ysm-macos/evidence/
            development/ysm-macos/dist/
          if-no-files-found: warn
          retention-days: 7
  windows-native:
    if: github.event_name == 'workflow_dispatch' && inputs.platform == 'windows'
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: actions/cache@v4
        id: windows-cache
        with:
          path: development/ysm-macos/native/conan/cache
          key: ysm-windows2025-clang22-e9ac162-v1-${{ github.run_id }}
          restore-keys: ysm-windows2025-clang22-e9ac162-v1-
      - name: Build and test Windows server and client native code
        shell: pwsh
        run: '& ./development/ysm-macos/build-windows.ps1'
      - uses: actions/cache/save@v4
        if: always() && steps.windows-cache.outputs.cache-hit != 'true'
        with:
          path: development/ysm-macos/native/conan/cache
          key: ysm-windows2025-clang22-e9ac162-v1-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: YSM-Windows-development-${{ github.run_number }}
          path: |
            development/ysm-macos/evidence/
            development/ysm-macos/dist/
          if-no-files-found: warn
          retention-days: 7