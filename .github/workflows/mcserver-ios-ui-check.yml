name: MCServer iOS UIKit screen check
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/mcserver-ios-ui-check.yml']
permissions:
  contents: read
jobs:
  ui:
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - name: Fetch verified iOS source
        run: |
          python3 - <<'PY'
          import urllib.request,json,hashlib,zipfile,io,pathlib
          req=urllib.request.Request('https://api.github.com/repos/allie-31234131/mcserver-modpack/releases/tags/mcserver-assets',headers={'User-Agent':'MCServer-iOS-UI-CI'})
          release=json.load(urllib.request.urlopen(req))
          assets=[a for a in release['assets'] if a['name'].startswith('MCServer-iOS-v0.1.0-source-') and a['name'].endswith('.zip')]
          asset=max(assets,key=lambda a:a['id']);data=urllib.request.urlopen(asset['browser_download_url']).read()
          assert asset['digest']=='sha256:'+hashlib.sha256(data).hexdigest()
          root=pathlib.Path('mcserver-ios').resolve();root.mkdir()
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              for e in z.infolist():
                  assert (root/e.filename).resolve().is_relative_to(root) and (e.external_attr>>16)&0o170000!=0o120000
              z.extractall(root)
          PY
      - name: Compile and run real UIKit screen with mocked backend
        run: /bin/bash mcserver-ios/source/preview/check_ui.sh
      - uses: actions/upload-artifact@v4
        with:
          name: MCServer-iOS-UI-preview-mocked-backend
          path: mcserver-ios/source/dist/*
          if-no-files-found: error
